    <style>

            align-items: center;
            padding: 20px 10px 60px;
            overflow-x: hidden;

        }

        /* Ambient Stars Background */
        .star {
            position: absolute;
            background: #fff;

            opacity: 0.6;
            animation: twinkle var(--duration) infinite ease-in-out;

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }

        }

        /* Music Floating Button */
        .music-btn {
            position: fixed;

            right: 15px;
            background: rgba(236, 72, 153, 0.2);
            border: 1px solid #ec4899;
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
            z-index: 100;
            font-weight: 600;
            transition: all 0.3s;
        }

        .music-btn:hover {
            background: rgba(236, 72, 153, 0.6);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.8);
        }

        header {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 25px;
            z-index: 2;
        }

            font-size: 2.8rem;
            background: linear-gradient(45deg, #ff007f, #7928ca, #00dfd8);

        .subtitle {
            font-size: 1.1rem;
            color: #d1d5db;

        }

        /* Main Glass Card */
        .main-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 24px;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(121, 40, 202, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            margin-bottom: 30px;
        }

        /* Neon Profile Frame */
        .profile-wrapper {
            position: relative;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            padding: 5px;

            border: 3px solid #090514;
        }

        /* Interactive Candle */
        .cake-section {

            flex-direction: column;
            align-items: center;

            position: relative;
            width: 160px;
            height: 100px;
            background: linear-gradient(to right, #ec4899, #8b5cf6);
            border-radius: 12px 12px 4px 4px;
            box-shadow: inset 0 -15px 0 #be185d, 0 0 25px rgba(236, 72, 153, 0.5);
            margin-top: 50px;
            cursor: pointer;
        }

        .cake::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 0;
            width: 100%;
            height: 20px;
            background: #fbcfe8;
            border-radius: 10px 10px 0 0;
        }

        .candle {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 35px;
            background: repeating-linear-gradient(45deg, #00dfd8, #00dfd8 5px, #ffffff 5px, #ffffff 10px);
            border-radius: 3px;
        }

        .flame {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 20px;
            background: #ff007f;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ff007f, 0 0 25px #ff007f;
            animation: flicker 0.6s infinite alternate;
            transition: opacity 0.5s ease;
        }

        .flame.off {
            opacity: 0;
            animation: none;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(1.1) rotate(2deg); }
        }

        .btn-action {

            color: #ffffff;
            padding: 20px;

            text-align: center;

            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Neon Polaroid Gallery */
        .gallery-title {
            font-size: 1.5rem;
            margin: 20px 0 15px;
            color: #00dfd8;

        }

            background: #120b29;
            border: 1px solid rgba(236, 72, 153, 0.4);
            padding: 12px 12px 25px 12px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
            transform: rotate(-3deg);
            transition: transform 0.3s ease;
            width: 200px;
        }

        .polaroid:nth-child(even) {
            transform: rotate(3deg);
        }

        .polaroid:hover {
            transform: scale(1.08) rotate(0deg);

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
