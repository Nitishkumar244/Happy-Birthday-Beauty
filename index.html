<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Beauty! 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c20, #1a103c, #2b0938);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px 60px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Stars Background */
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 25px;
            z-index: 2;
        }

        h1 {
            font-size: 2.8rem;
            background: linear-gradient(45deg, #ff7eb3, #ff758c, #ff9a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.4);
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #d1d5db;
            font-style: italic;
        }

        /* Container Card */
        .main-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
            margin-bottom: 30px;
        }

        /* Profile Photo Container */
        .profile-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, #ff7eb3, #764ba2);
            box-shadow: 0 0 30px rgba(255, 126, 179, 0.5);
            margin-bottom: 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1a103c;
        }

        /* Interactive Cake Section */
        .cake-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
            width: 100%;
        }

        .cake {
            position: relative;
            width: 160px;
            height: 100px;
            background: #f472b6;
            border-radius: 12px 12px 4px 4px;
            box-shadow: inset 0 -15px 0 #db2777, 0 10px 20px rgba(0, 0, 0, 0.3);
            margin-top: 50px;
            cursor: pointer;
        }

        .cake::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 0;
            width: 100%;
            height: 20px;
            background: #fbcfe8;
            border-radius: 10px 10px 0 0;
        }

        .candle {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 35px;
            background: repeating-linear-gradient(45deg, #60a5fa, #60a5fa 5px, #ffffff 5px, #ffffff 10px);
            border-radius: 3px;
        }

        .flame {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 20px;
            background: #fbbf24;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #f59e0b, 0 0 25px #f59e0b;
            animation: flicker 0.6s infinite alternate;
            transition: opacity 0.5s ease;
        }

        .flame.off {
            opacity: 0;
            animation: none;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
            100% { transform: translateX(-50%) scale(1.1) rotate(2deg); }
        }

        .btn-action {
            margin-top: 25px;
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            border: none;
            color: #fff;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(236, 72, 153, 0.6);
        }

        /* Secret Letter */
        .letter-card {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            color: #1f2937;
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Polaroid Gallery */
        .gallery-title {
            font-size: 1.5rem;
            margin: 20px 0 15px;
            color: #f472b6;
        }

        .polaroid-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 700px;
            z-index: 2;
        }

        .polaroid {
            background: #ffffff;
            padding: 12px 12px 25px 12px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transform: rotate(-3deg);
            transition: transform 0.3s ease;
            width: 200px;
        }

        .polaroid:nth-child(even) {
            transform: rotate(3deg);
        }

        .polaroid:hover {
            transform: scale(1.08) rotate(0deg);
            z-index: 5;
        }

        .polaroid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
        }

        .polaroid-caption {
            color: #374151;
            font-weight: 600;
            text-align: center;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        /* Canvas for Confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <header>
        <h1>Happy Birthday Beauty! 🎂</h1>
        <p class="subtitle">Wishing you a day filled with joy, love, and laughter!</p>
    </header>

    <main class="main-card">
        <!-- Profile Picture using beauty di.jpeg -->
        <div class="profile-wrapper">
            <img src="beauty di.jpeg" alt="Beauty" class="profile-img">
        </div>

        <!-- Cake & Candle -->
        <div class="cake-section">
            <div class="cake" onclick="blowCandle()">
                <div class="candle">
                    <div class="flame" id="flame"></div>
                </div>
            </div>
            <button class="btn-action" onclick="blowCandle()">🕯️ Blow the Candle!</button>
        </div>

        <!-- Interactive Surprise Button -->
        <button class="btn-action" style="background: linear-gradient(45deg, #10b981, #3b82f6);" onclick="toggleLetter()">💌 Open Birthday Wish</button>

        <!-- Hidden Letter -->
        <div class="letter-card" id="secret-letter">
            <h3>Dear Sister Beauty, ✨</h3>
            <p style="margin-top: 10px; line-height: 1.6;">
                May your special day bring you endless happiness, beautiful memories, and all the success in the world. Keep shining bright! Happy Birthday! 💖
            </p>
        </div>
    </main>

    <!-- Photo Gallery Grid -->
    <h2 class="gallery-title">📸 Beautiful Memories</h2>
    <div class="polaroid-grid">
        <div class="polaroid">
            <img src="beauty di.jpeg" alt="Beauty Photo 1">
            <div class="polaroid-caption">Best Sister ❤️</div>
        </div>
        <div class="polaroid">
            <img src="beauty di.jpeg" alt="Beauty Photo 2">
            <div class="polaroid-caption">Happy Times 🎉</div>
        </div>
    </div>

    <script>
        // Star particle generator
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            document.body.appendChild(star);
        }

        // Blow Candle Functionality
        let blown = false;
        function blowCandle() {
            const flame = document.getElementById('flame');
            flame.classList.add('off');
            if (!blown) {
                blown = true;
                startConfetti();
            }
        }

        // Letter Toggle Function
        function toggleLetter() {
            const letter = document.getElementById('secret-letter');
            if (letter.style.display === 'block') {
                letter.style.display = 'none';
            } else {
                letter.style.display = 'block';
                startConfetti();
            }
        }

        // Simple Confetti Animation
        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#f472b6', '#60a5fa', '#fbbf24', '#34d399', '#a78bfa'];

            for (let i = 0; i < 100; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 3 + 2,
                    angle: Math.random() * 360
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach((p) => {
                    ctx.save();
                    ctx.beginPath();
                    ctx.fillStyle = p.color;
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    p.y += p.speed;
                    if (p.y > canvas.height) p.y = -10;
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
