<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Beauty! ✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #06030F;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 12px 60px;
            overflow-x: hidden;
            position: relative;
        }

        /* Pure Ambient Lighting - No blocking */
        .neon-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none !important;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            pointer-events: none !important;
        }
        .orb-1 { top: -80px; left: -80px; width: 300px; height: 300px; background: #FF007F; }
        .orb-2 { bottom: -80px; right: -80px; width: 350px; height: 350px; background: #00F3FF; }

        /* Floating Top Music Button */
        .music-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 999999;
            background: rgba(255, 0, 127, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #ffffff;
            padding: 12px 22px;
            border-radius: 30px;
            border: 2px solid #FF007F;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
            font-weight: bold;
            font-size: 0.95rem;
            pointer-events: auto !important;
        }

        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 25px;
            z-index: 10;
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            color: #FF007F;
            text-shadow: 0 0 15px #FF007F, 0 0 30px #00F3FF;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #FFD700;
            text-shadow: 0 0 10px #FFD700;
            font-style: italic;
        }

        /* Main Royal Neon Glass Card */
        .main-card {
            background: rgba(18, 10, 36, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 0, 127, 0.6);
            border-radius: 24px;
            width: 100%;
            max-width: 550px;
            padding: 30px 20px;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.35), inset 0 0 15px rgba(0, 243, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            margin-bottom: 30px;
            pointer-events: auto !important;
        }

        /* Royal Neon Crest Profile Frame */
        .profile-frame {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(45deg, #FF007F, #00F3FF, #FFD700);
            box-shadow: 0 0 30px #FF007F;
            margin-bottom: 25px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #06030F;
            display: block;
        }

        /* Royal Cake Section */
        .cake-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0 20px;
            width: 100%;
        }

        .cake {
            position: relative;
            width: 150px;
            height: 85px;
            background: linear-gradient(to right, #FF007F, #7928CA);
            border-radius: 12px 12px 4px 4px;
            box-shadow: inset 0 -10px 0 #9D174D, 0 0 25px rgba(255, 0, 127, 0.6);
            margin-top: 35px;
            cursor: pointer;
            pointer-events: auto !important;
        }

        .cake::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 0;
            width: 100%;
            height: 15px;
            background: #fbcfe8;
            border-radius: 10px 10px 0 0;
        }

        .candle {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 30px;
            background: linear-gradient(to bottom, #00F3FF, #ffffff);
            border-radius: 3px;
        }

        .flame {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 18px;
            background: #FFD700;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #FFD700, 0 0 25px #FF007F;
            animation: flicker 0.5s infinite alternate;
        }

        .flame.off {
            display: none !important;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.2); }
        }

        .action-btn {
            margin-top: 20px;
            background: linear-gradient(45deg, #FF007F, #00F3FF);
            border: none;
            color: #ffffff;
            padding: 13px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
            pointer-events: auto !important;
            z-index: 20;
            transition: transform 0.15s ease;
        }
        .action-btn:active {
            transform: scale(0.96);
        }

        /* Wish Letter Box */
        .wish-box {
            display: none;
            background: rgba(6, 3, 15, 0.95);
            border: 2px solid #00F3FF;
            color: #ffffff;
            padding: 22px;
            border-radius: 16px;
            margin-top: 20px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
            pointer-events: auto !important;
        }

        /* Neon Polaroid Gallery */
        .gallery-title {
            font-size: 1.5rem;
            margin: 25px 0 15px;
            color: #00F3FF;
            text-shadow: 0 0 12px #00F3FF;
            z-index: 10;
        }

        .polaroid-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            z-index: 10;
            pointer-events: auto !important;
        }

        .polaroid {
            background: #120A24;
            border: 1px solid #FF007F;
            padding: 12px 12px 22px 12px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            width: 190px;
            text-align: center;
            transform: rotate(-3deg);
            transition: transform 0.2s ease;
        }

        .polaroid:nth-child(even) {
            transform: rotate(3deg);
        }

        .polaroid:hover {
            transform: scale(1.05) rotate(0deg);
        }

        .polaroid img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 4px;
        }

        .polaroid-caption {
            color: #FFD700;
            font-weight: bold;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none !important;
            z-index: 999;
        }
    </style>
</head>
<body>

    <button class="music-btn" id="music-btn" onclick="toggleMusic()">🎵 Play Music</button>

    <div class="neon-background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <header>
        <h1>Happy Birthday Beauty! 🎉</h1>
        <p class="subtitle">✨ Royal Neon Birthday Wishes ✨</p>
    </header>

    <main class="main-card">
        <!-- Sister Photo -->
        <div class="profile-frame">
            <img src="beauty di.jpeg" alt="Beauty" class="profile-img">
        </div>

        <!-- Interactive Cake -->
        <div class="cake-container">
            <div class="cake" onclick="blowCandle()">
                <div class="candle">
                    <div class="flame" id="flame"></div>
                </div>
            </div>
            <button class="action-btn" onclick="blowCandle()">🕯️ Blow Candle</button>
        </div>

        <!-- Interactive Wish Envelope -->
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <button class="action-btn" style="background: linear-gradient(45deg, #00F3FF, #FF007F);" onclick="openWish()">💌 Open Surprise Letter</button>

            <div class="wish-box" id="wish-box">
                <h3 style="color: #FF007F; font-size: 1.25rem;">Dear Sister Beauty, ✨</h3>
                <p style="margin-top: 12px; line-height: 1.6; color: #e5e7eb; font-size: 0.98rem;">
                    Wishing you a birthday filled with infinite happiness, success, and glowing smiles! May all your dreams come true. Keep shining bright like a star! 💖
                </p>
            </div>
        </div>
    </main>

    <h2 class="gallery-title">📸 Memory Gallery</h2>
    <div class="polaroid-grid">
        <div class="polaroid">
            <img src="beauty di.jpeg" alt="Beauty Frame 1">
            <div class="polaroid-caption">Best Sister Ever ❤️️</div>
        </div>
        <div class="polaroid">
            <img src="beauty di.jpeg" alt="Beauty Frame 2">
            <div class="polaroid-caption">Always Keep Smiling 🎉</div>
        </div>
    </div>

    <script>
        // Candle Blow Action
        function blowCandle() {
            document.getElementById('flame').classList.add('off');
            triggerConfetti();
            startMusicEngine();
        }

        // Open Letter Action
        function openWish() {
            document.getElementById('wish-box').style.display = 'block';
            triggerConfetti();
            startMusicEngine();
        }

        // Web Audio Sound Engine
        let audioCtx = null;
        let isPlaying = false;
        let timer = null;

        function startMusicEngine() {
            if (!isPlaying) {
                toggleMusic();
            }
        }

        function toggleMusic() {
            const btn = document.getElementById('music-btn');
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (!isPlaying) {
                isPlaying = true;
                btn.innerText = '⏸️ Pause Music';
                
                const notes = [264, 264, 297, 264, 352, 330, 264, 264, 297, 264, 396, 352, 264, 264, 528, 440, 352, 330, 297];
                let i = 0;

                timer = setInterval(() => {
                    if (isPlaying) {
                        playNote(notes[i], 0.3);
                        i = (i + 1) % notes.length;
                    }
                }, 330);
            } else {
                isPlaying = false;
                clearInterval(timer);
                btn.innerText = '🎵 Play Music';
            }
        }

        function playNote(freq, dur) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch(e) {}
        }

        // Confetti Effect
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#FF007F', '#00F3FF', '#FFD700', '#ffffff'];

            for (let i = 0; i < 65; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 5 + 3,
                    c: colors[Math.floor(Math.random() * colors.length)],
                    s: Math.random() * 3 + 2
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p) => {
                    ctx.beginPath();
                    ctx.fillStyle = p.c;
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                    p.y += p.s;
                    if (p.y > canvas.height) p.y = -10;
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
