    <script>
        // Bulletproof Event Binder helper (handles both desktop click and mobile touchstart)
        function bindDirectTouch(elementId, callbackAction) {
            const element = document.getElementById(elementId);
            if (!element) return;

            let handled = false;

            const triggerHandler = function(e) {
                e.stopPropagation();
                if (!handled) {
                    handled = true;
                    callbackAction();
                    setTimeout(() => { handled = false; }, 300);
                }
            };

            element.addEventListener('click', triggerHandler, { passive: false });
            element.addEventListener('touchstart', triggerHandler, { passive: false });
        }

        let isCandleBlown = false;

        // Action 1: Blow Candle Logic
        function handleBlowCandle() {
            const flame = document.getElementById('candle-flame');
            if (!isCandleBlown) {
                flame.classList.add('off');
                isCandleBlown = true;
            } else {
                flame.classList.remove('off');
                isCandleBlown = false;
            }

            fireConfettiBurst();
            startAudioTune();
        }

        // Action 2: Open Letter Logic
        function handleOpenLetter() {
            const letter = document.getElementById('wish-letter');
            letter.style.display = 'block';

            fireConfettiBurst();
            startAudioTune();
        }

        // Action 3: Web Audio API Tune Engine
        let audioCtx = null;
        let isPlaying = false;
        let noteTimer = null;

        function startAudioTune() {
            if (!isPlaying) {
                handleMusicToggle();
            }
        }

        function handleMusicToggle() {
            const btnText = document.getElementById('music-text');
            const btnIcon = document.getElementById('music-icon');

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (!isPlaying) {
                isPlaying = true;
                btnText.innerText = 'Pause Tune';
                btnIcon.innerText = '⏸️';

                const notes = [
                    264, 264, 297, 264, 352, 330,
                    264, 264, 297, 264, 396, 352,
                    264, 264, 528, 440, 352, 330, 297
                ];
                let idx = 0;

                noteTimer = setInterval(() => {
                    if (isPlaying) {
                        playSynthNote(notes[idx], 0.3);
                        idx = (idx + 1) % notes.length;
                    }
                }, 330);
            } else {
                isPlaying = false;
                clearInterval(noteTimer);
                btnText.innerText = 'Play Birthday Tune';
                btnIcon.innerText = '🎵';
            }
        }

        function playSynthNote(freq, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function fireConfettiBurst() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#FF007F', '#00F3FF', '#FFD700', '#ffffff'];

            for (let i = 0; i < 75; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height * 0.4,
                    r: Math.random() * 5 + 3,
                    c: colors[Math.floor(Math.random() * colors.length)],
                    sy: Math.random() * 4 + 2,
                    sx: (Math.random() - 0.5) * 3
                });
            }

            let frames = 0;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p) => {
                    ctx.beginPath();
                    ctx.fillStyle = p.c;
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();

                    p.y += p.sy;
                    p.x += p.sx;
                });

                frames++;
                if (frames < 140) {
                    requestAnimationFrame(draw);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            draw();
        }

        // Bind all interactive controls securely on load
        window.addEventListener('DOMContentLoaded', () => {
            bindDirectTouch('blow-btn', handleBlowCandle);
            bindDirectTouch('cake-touch-trigger', handleBlowCandle);
            bindDirectTouch('letter-btn', handleOpenLetter);
            bindDirectTouch('music-btn', handleMusicToggle);
        });
    </script>
</body>
